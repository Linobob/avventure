// Toglie apostrofi e punteggiatura, tiene le lettere accentate (per mostrare la parola com'era scritta).
const base = s => String(s).toLowerCase().replace(/[’'`]/g, ' ').replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim();
// Come base, senza accenti (per confrontare le parole).
const norm = s => base(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

function indicizza(c) {
  const verbo = new Map(), dir = new Map(), nomi = new Map(), agg = new Map(), aggDi = new Map(), prep = new Set((c.vocabolario.preposizioni || []).map(norm));
  const ign = new Set((c.vocabolario.ignora || []).map(norm));
  const cp = chiaviParole(c);
  for (const [k, ws] of Object.entries(c.vocabolario.verbi)) (cp ? [k, ...ws] : ws).forEach(w => verbo.set(norm(w), k));
  for (const [k, ws] of Object.entries(c.vocabolario.direzioni)) (cp ? [k, ...ws] : ws).forEach(w => dir.set(norm(w), k));
  for (const o of c.oggetti) {
    [o.nome, ...(o.sinonimi || [])].forEach(w => {
      const n = norm(w);
      if (!nomi.has(n)) nomi.set(n, new Set());
      nomi.get(n).add(o.id);
    });
    aggDi.set(o.id, new Set());
    (o.aggettivi || []).forEach(w => { const n = norm(w); if (n) { agg.set(n, true); aggDi.get(o.id).add(n); } });
  }
  return { verbo, dir, ign, nomi, agg, aggDi, prep };
}

function creaPartita(c) {
  const pos = {};
  c.oggetti.forEach(o => { pos[o.id] = o.dove; });
  const vars = {};
  (c.variabili || []).forEach(v => { vars[v.id] = v.iniziale || 0; });
  (c.eventi || []).forEach((e, i) => { if (e.una_volta) vars['_ev' + i] = 0; });
  return { stanza: c.inizio, pos, aperti: [], attivi: [], finito: false, vars };
}

function leggiDati(nodo) {
  var b = atob(nodo.textContent.replace(/[^A-Za-z0-9+/=]/g, '')), dati = new Uint8Array(b.length), x = Number(nodo.dataset.k) >>> 0;
  for (var i = 0; i < b.length; i++) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; dati[i] = b.charCodeAt(i) ^ (x >>> 24); }
  var testo = nodo.dataset.z === '1'
    ? new Response(new Blob([dati]).stream().pipeThrough(new DecompressionStream('deflate'))).text()
    : Promise.resolve(new TextDecoder().decode(dati));
  return testo.then(JSON.parse);
}
leggiDati(document.getElementById('core')).then(function (CORE) {
  var IDX = indicizza(CORE), ST, U = ui(CORE);
  var registro = document.getElementById('registro');
  document.getElementById('titolo').textContent = CORE.titolo || U.titolo;
  document.querySelector('label[for=cmd]').textContent = U.comando;
  document.getElementById('cmd').placeholder = U.scrivi;
  document.getElementById('invia').textContent = U.invia;
  function riga(tipo, t, ogg) {
    if (tipo === 'figura') { var fo = figuraOggetto(CORE, ogg); if (fo) registro.appendChild(fo); return; }
    var p = document.createElement('p');
    p.className = 'riga ' + tipo;
    p.textContent = t;
    if (tipo === 'stanza') { var f = figuraStanza(CORE, ST); if (f) registro.appendChild(f); }
    registro.appendChild(p);
    registro.scrollTop = registro.scrollHeight;
  }
  function rapidi() {
    var box = document.getElementById('rapidi');
    box.textContent = '';
    comandiRapidi(CORE, ST).forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rapido';
      b.textContent = r.etichetta;
      b.addEventListener('click', function () { invia(r.comando); });
      box.appendChild(b);
    });
  }
  function avvia() {
    var ap = apriPartita(CORE);
    ST = ap.st;
    registro.textContent = '';
    var ft = figuraTitolo(CORE); if (ft) registro.appendChild(ft);
    if (CORE.introduzione) riga('testo', CORE.introduzione);
    ap.out.forEach(function (r) { riga(r.tipo, r.testo); });
    rapidi();
    registro.scrollTop = 0;
  }
  function invia(t) {
    t = t.trim();
    if (!t) return;
    riga('eco', '> ' + t);
    if (ST.finito && norm(t) === norm(ui(CORE).ricomincia)) { avvia(); return; }
    var r = esegui(CORE, IDX, ST, t);
    ST = r.st;
    r.out.forEach(function (x) { riga(x.tipo, x.testo, x.oggetto); });
    rapidi();
  }
  // niente invio di modulo: alcuni visualizzatori (pagine in riquadro isolato) lo bloccano; si usano il tasto Invio e il clic
  function manda() {
    var c = document.getElementById('cmd');
    var t = c.value;
    c.value = '';
    invia(t);
    c.focus();
  }
  document.getElementById('cmd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); manda(); }
  });
  document.getElementById('invia').addEventListener('click', manda);
  document.getElementById('modulo').addEventListener('submit', function (e) { e.preventDefault(); manda(); });
  avvia();
}).catch(function () {
  document.getElementById('registro').textContent = (LINGUE_UI[document.documentElement.lang] || LINGUE_UI.it).vecchio;
});
</script>
</body>
</html>
