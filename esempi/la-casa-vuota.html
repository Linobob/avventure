<script>

// Toglie apostrofi e punteggiatura, tiene le lettere accentate (per mostrare la parola com'era scritta).
const base = s => String(s).toLowerCase().replace(/[’'`]/g, ' ').replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim();
// Come base, senza accenti (per confrontare le parole).
const norm = s => base(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

function indicizza(c) {
  const verbo = new Map(), dir = new Map(), nomi = new Map(), agg = new Map(), aggDi = new Map(), prep = new Set((c.vocabolario.preposizioni || []).map(norm));
  const ign = new Set((c.vocabolario.ignora || []).map(norm));
  const cp = chiaviParole(c);
  for (const [k, ws] of Object.entries(c.vocabolario.verbi)) (cp ? [k, ...ws] : ws).forEach(w => verbo.set(norm(w), k));
  for (const [k, ws] of Object.entries(c.vocabolario.direzioni)) (cp ? [k, ...ws] : ws).forEach(w => dir.set(norm(w), k));
  for (const o of c.oggetti) {
    [o.nome, ...(o.sinonimi || [])].forEach(w => {
      const n = norm(w);
      if (!nomi.has(n)) nomi.set(n, new Set());
      nomi.get(n).add(o.id);
    });
    aggDi.set(o.id, new Set());
    (o.aggettivi || []).forEach(w => { const n = norm(w); if (n) { agg.set(n, true); aggDi.get(o.id).add(n); } });
  }
  return { verbo, dir, ign, nomi, agg, aggDi, prep };
}

function creaPartita(c) {
  const pos = {};
  c.oggetti.forEach(o => { pos[o.id] = o.dove; });
  const vars = {};
  (c.variabili || []).forEach(v => { vars[v.id] = v.iniziale || 0; });
  (c.eventi || []).forEach((e, i) => { if (e.una_volta) vars['_ev' + i] = 0; });

// Gli oggetti presenti (in `dove`) che corrispondono alle parole: almeno un nome tra quelle date, e tutti gli aggettivi.

// Regole: quando il giocatore scrive un comando, se valgono le condizioni, succedono le azioni.
const tipoAzione = a => Object.keys(a)[0];

  else if (t === 'sposta') st.pos[a.sposta.oggetto] = a.sposta.a;
  else if (t === 'apri') { if (!st.aperti.includes(a.apri)) st.aperti.push(a.apri); }
  else if (t === 'chiudi') { const i = st.aperti.indexOf(a.chiudi); if (i >= 0) st.aperti.splice(i, 1); }
  else if (t === 'accendi') { if (!st.attivi.includes(a.accendi)) st.attivi.push(a.accendi); }
  else if (t === 'spegni') { const i = st.attivi.indexOf(a.spegni); if (i >= 0) st.attivi.splice(i, 1); }

// Esegue le azioni in ordine; se una ha aperto un contenitore, alla fine mostra che cosa c'è dentro.
function eseguiAzioni(c, st, azioni, out) {

  if (aperto) contenuto(c, st, c.oggetti.find(o => o.id === aperto)).forEach(r => out.push(r));

// Eventi d'ingresso: scattano dopo la descrizione della stanza in cui si entra, tutti quelli che combaciano, nell'ordine.
function ingresso(c, st, out) {
  (c.eventi || []).forEach((e, i) => {

    if (e.una_volta && st.vars['_ev' + i]) return;

// Inizio della partita: stato iniziale, descrizione della prima stanza ed eventi d'ingresso.
function apriPartita(c) {

function provaRegole(c, st, verbo, o1, o2, out) {

// Esegue un comando. Non modifica lo stato ricevuto: restituisce le righe da mostrare e il nuovo stato.
function esegui(c, idx, stato, input) {

  catch (e) {

      if (o) { di('testo', descr(o, st) || testo(c, 'descrizione_vuota')); contenuto(c, st, o).forEach(r => out.push(r)); }
      else di('errore', testo(c, 'non_presente'));

    else if (cercaTutto(c, idx, st, princ)) azioniTutto(c, st, 'prendi', out);
    else {
      const o = trovaOggetto(c, idx, st, princ, [st.stanza]);
      if (o) {

}

// «prendi tutto» / «lascia tutto»: le parole indicano l'oggetto speciale «tutto»?
function cercaTutto(c, idx, st, parole) {

function azioniTutto(c, st, verbo, out) {
  const prendi = verbo === 'prendi';
  const buio = prendi && senzaLuce(c, st);
  const cand = buio ? [] : c.oggetti.filter(o => !o.argomento && !o.personaggio && (prendi ? st.pos[o.id] === st.stanza && o.prendibile && !(o.in_elenco === false && o.dove === st.stanza) : st.pos[o.id] === 'inventario'));
  if (!cand.length) { out.push({ tipo: 'errore', testo: testo(c, prendi ? 'niente_da_prendere' : 'niente_da_lasciare') }); return; }
  for (const o of cand) {
    const et = etichetta(o, st), tmp = [];

    else { st.pos[o.id] = prendi ? 'inventario' : st.stanza; out.push({ tipo: 'testo', testo: et + ': ' + testo(c, prendi ? 'preso' : 'lasciato') }); }
    if (st.finito) break;
  }
}

// Comandi rapidi per il telefono: le uscite della stanza, più guarda e inventario.
function comandiRapidi(c, st) {
  if (st.finito) return [{ comando: ui(c).ricomincia, etichetta: ui(c).ricomincia }];
  const us = usciteVisibili(c, st).map(([d]) => ({ comando: parola(c, 'direzioni', d), etichetta: nomeDir(c, d) }));
  const g = parola(c, 'verbi', 'guarda'), i = parola(c, 'verbi', 'inventario');
  return [...us, { comando: g, etichetta: g }, { comando: i, etichetta: i }];
}

// I dati del gioco sono compressi e rimescolati, così non si leggono aprendo il sorgente della pagina.
function leggiDati(nodo) {
  var b = atob(nodo.textContent.replace(/[^A-Za-z0-9+/=]/g, '')), dati = new Uint8Array(b.length), x = Number(nodo.dataset.k) >>> 0;
  for (var i = 0; i < b.length; i++) { x = (Math.imul(x, 1103515245) + 12345) >>> 0; dati[i] = b.charCodeAt(i) ^ (x >>> 24); }

  function riga(tipo, t) {

}).catch(function () {

});
